server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 51m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server inference deadline is 90s; leave its structured 504 intact.
        # Browser deadline remains 120s. No retry of POST on another backend.
        proxy_connect_timeout 5s;
        proxy_send_timeout 125s;
        proxy_read_timeout 125s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
